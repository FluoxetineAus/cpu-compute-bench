name: mac-arm64-bench

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Samples per test for the full run
        required: false
        default: "5"

jobs:
  bench:
    name: ${{ matrix.os }} / ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 standard arm64 is not available on this account
          # ("configuration macos-14-arm64-us-default is not supported").
          # macos-15 currently provisions a 3-vCPU Apple M1 (Virtual) runner.
          - os: macos-15
            cpu: apple-m1
    steps:
      - uses: actions/checkout@v4

      - name: Machine info
        run: |
          set -x
          uname -a
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu
          sysctl -n hw.physicalcpu
          sysctl -n hw.perflevel0.physicalcpu || true
          sysctl -n hw.perflevel1.physicalcpu || true
          clang --version

      - name: Build all modules
        run: |
          set -eux
          make clean
          make

      - name: Run quick
        run: |
          set -x
          ./cpu-bench --quick --json "quick-${{ matrix.os }}.json"

      - name: Run full
        run: |
          set -x
          ./cpu-bench --samples "${{ github.event.inputs.samples }}" \
            --json "full-${{ matrix.os }}.json"

      - name: Run Application benchmark
        run: |
          set -x
          ./application/application-bench --samples "${{ github.event.inputs.samples }}" \
            --json "application-${{ matrix.os }}.json"

      - name: Run Memory benchmark
        run: |
          set -x
          ./memory/memory-bench --samples "${{ github.event.inputs.samples }}" \
            --json "memory-${{ matrix.os }}.json"

      - name: Run P-cores if available
        run: |
          EFF="$(sysctl -n hw.perflevel1.physicalcpu 2>/dev/null || echo 0)"
          echo "efficiency cores: $EFF"
          if [ "$EFF" -gt 0 ]; then
            ./cpu-bench --pcores --samples "${{ github.event.inputs.samples }}" \
              --json "pcores-${{ matrix.os }}.json"
          else
            echo "No heterogeneous P/E perflevels exposed by this VM; skipping --pcores"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            quick-*.json
            full-*.json
            pcores-*.json
            application-*.json
            memory-*.json
          if-no-files-found: warn
