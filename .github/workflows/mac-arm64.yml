name: mac-arm64-bench

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Samples per test for the full run
        required: false
        default: "5"

jobs:
  bench:
    name: ${{ matrix.os }} / ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 standard arm64 is not available on this account
          # ("configuration macos-14-arm64-us-default is not supported").
          # macos-15 currently provisions a 3-vCPU Apple M1 (Virtual) runner.
          - os: macos-15
            cpu: apple-m1
            prebuilt: cpu-bench-arm64-m1
    steps:
      - uses: actions/checkout@v4

      - name: Machine info
        run: |
          set -x
          uname -a
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu
          sysctl -n hw.physicalcpu
          sysctl -n hw.perflevel0.physicalcpu || true
          sysctl -n hw.perflevel1.physicalcpu || true
          clang --version

      - name: Build native for this runner
        run: |
          set -eux
          clang -O3 -mcpu=${{ matrix.cpu }} \
            -fno-math-errno -ffp-contract=fast -std=c11 -pthread \
            -fno-vectorize -fno-slp-vectorize \
            -DBENCH_FLAGS="\"-O3 -mcpu=${{ matrix.cpu }} (CI)\"" \
            bench.c -o cpu-bench -lm

      - name: Run quick
        run: |
          set -x
          ./cpu-bench --quick --json "quick-${{ matrix.os }}.json"

      - name: Run full
        run: |
          set -x
          ./cpu-bench --samples "${{ github.event.inputs.samples }}" \
            --json "full-${{ matrix.os }}.json"

      - name: Run fair 3-thread comparison
        run: |
          set -x
          ./cpu-bench --fair3 --samples "${{ github.event.inputs.samples }}" \
            --json "fair3-${{ matrix.os }}.json"

      - name: Run P-cores if available
        run: |
          EFF="$(sysctl -n hw.perflevel1.physicalcpu 2>/dev/null || echo 0)"
          echo "efficiency cores: $EFF"
          if [ "$EFF" -gt 0 ]; then
            ./cpu-bench --pcores --samples "${{ github.event.inputs.samples }}" \
              --json "pcores-${{ matrix.os }}.json"
          else
            echo "No heterogeneous P/E perflevels exposed by this VM; skipping --pcores"
          fi

      - name: Run prebuilt binary
        run: |
          set -x
          chmod +x "${{ matrix.prebuilt }}"
          "./${{ matrix.prebuilt }}" --quick --json "prebuilt-${{ matrix.os }}.json"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            quick-*.json
            full-*.json
            pcores-*.json
            fair3-*.json
            prebuilt-*.json
          if-no-files-found: warn
